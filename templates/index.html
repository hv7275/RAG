<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="sidebar-header">
                    <button id="sidebarToggle" class="btn-icon-sidebar" title="Close sidebar">
                        <i class="fa-solid fa-bars-staggered"></i>
                    </button>
                    <button id="newChatBtn" class="btn-icon-sidebar" title="New chat">
                        <i class="fa-regular fa-pen-to-square"></i>
                    </button>
                </div>

                <nav class="sidebar-nav">
                    <button class="nav-item active">
                        <i class="fa-brands fa-microblog"></i>
                        <span>ChatGPT 5.1</span>
                        <i class="fa-solid fa-chevron-down dropdown-icon"></i>
                    </button>
                    <button class="nav-item">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <span>Search chats</span>
                    </button>
                    <button class="nav-item">
                        <i class="fa-solid fa-book-open"></i>
                        <span>Library</span>
                    </button>
                    <button class="nav-item">
                        <i class="fa-solid fa-shapes"></i>
                        <span>GPTs</span>
                    </button>
                </nav>

                <div class="sidebar-section">
                    <div class="section-title">Projects</div>
                    <button class="nav-item">
                        <i class="fa-regular fa-folder-open"></i>
                        <span>New project</span>
                    </button>
                    <button class="nav-item">
                        <i class="fa-regular fa-folder"></i>
                        <span>e-com site</span>
                    </button>
                </div>
            </div>

            <div class="sidebar-middle" id="chatHistoryList">
                <div class="section-title">Your chats</div>
                <!-- Chat history items will be injected here -->
            </div>

            <div class="sidebar-bottom">
                <div class="user-profile" id="userProfileSection">
                    <div class="user-avatar">HV</div>
                    <div class="user-info">
                        <span class="username" id="usernameDisplay">Guest</span>
                        <span class="user-plan">Free Plan</span>
                    </div>
                </div>
                <div class="auth-buttons" id="authButtons" style="display: none;">
                    <button id="loginBtn" class="btn-sidebar-auth">Log in</button>
                    <button id="registerBtn" class="btn-sidebar-auth">Sign up</button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar (Mobile/Desktop) -->
            <header class="top-bar">
                <button id="mobileSidebarToggle" class="btn-icon">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="model-selector">
                    <span>ChatGPT 5.1</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div class="top-actions">
                    <button class="btn-icon"><i class="fa-regular fa-user"></i></button>
                </div>
            </header>

            <!-- Landing View (Centered) -->
            <div class="landing-view" id="landingView">
                <div class="logo-container">
                    <div class="gpt-logo">
                        <i class="fa-solid fa-bolt"></i>
                    </div>
                </div>
                <h1>What can I help with?</h1>
            </div>

            <!-- Chat Stream (Hidden initially) -->
            <div class="chat-stream" id="chatStream" style="display: none;">
                <!-- Messages will be appended here -->
            </div>

            <!-- Input Area -->
            <div class="input-area-container" id="inputContainer">
                <div class="input-area">
                    <form id="queryForm" class="query-form">
                        <button type="button" class="btn-attach" title="Attach file">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                        <textarea id="queryInput" placeholder="Ask anything" rows="1"></textarea>
                        <div class="input-actions">
                            <button type="button" class="btn-voice" title="Use voice">
                                <i class="fa-solid fa-microphone"></i>
                            </button>
                            <button type="submit" id="submitBtn" class="btn-send" disabled>
                                <i class="fa-solid fa-arrow-up"></i>
                            </button>
                        </div>
                    </form>
                    <div class="input-footer">
                        <div class="settings-toggles">
                            <label class="toggle-switch" title="Generate AI Answer">
                                <input type="checkbox" id="generateAnswer" checked>
                                <span class="slider"></span>
                            </label>
                            <div class="k-input-wrapper" title="Number of chunks">
                                <span>K:</span>
                                <input type="number" id="kInput" value="4" min="1" max="20">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeLoginModal">&times;</span>
            <h2>Welcome back</h2>
            <form id="loginForm">
                <div class="form-group">
                    <input type="text" name="loginUsername" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <input type="password" name="loginPassword" placeholder="Password" required>
                </div>
                <div id="loginError" class="error-message"></div>
                <button type="submit" class="btn-primary btn-block">Continue</button>
            </form>
        </div>
    </div>

    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeRegisterModal">&times;</span>
            <h2>Create your account</h2>
            <form id="registerForm">
                <div class="form-group">
                    <input type="text" name="registerUsername" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <input type="email" name="registerEmail" placeholder="Email address" required>
                </div>
                <div class="form-group">
                    <input type="password" name="registerPassword" placeholder="Password" required>
                </div>
                <div id="registerError" class="error-message"></div>
                <button type="submit" class="btn-primary btn-block">Continue</button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>
